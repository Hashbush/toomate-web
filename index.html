                    teoriaUrl: "materiales/quimica-organica-2-bach.html",
                    ejerciciosUrl: "materiales/ejercicios-quimica-organica-2-bach.html"
                  }
                ]
              }
            }
          }
        }
      }
    };

    function renderizarFormula(latex) {
      if (typeof katex !== 'undefined') {
        try {
          return katex.renderToString(latex, { displayMode: true, throwOnError: false });
        } catch (e) {
          return latex;
        }
      }
      return latex;
    }

    function crearTarjetaTema(tema) {
      return `
        <div class="bg-white rounded-2xl border-2 border-slate-200 hover:border-slate-400 p-5 flex flex-col justify-between transition shadow-sm hover:shadow-md">
          <div>
            <!-- TÍTULO DEL TEMA -->
            <h4 class="font-display font-bold text-base sm:text-lg text-slate-900 text-center mb-3">
              ${tema.titulo}
            </h4>

            <!-- MUESTRA VISUAL DE ECUACIÓN (SIN RESOLVER) -->
            <div class="math-preview-box rounded-xl border border-slate-200 p-4 mb-4 min-h-[105px] flex items-center justify-center text-slate-800 shadow-inner overflow-x-auto">
              ${renderizarFormula(tema.muestraLatex)}
            </div>
          </div>

          <!-- BOTONES DE TEORÍA Y EJERCICIOS -->
          <div class="grid grid-cols-2 gap-2.5">
            <a href="${tema.teoriaUrl}" class="py-2.5 px-3 bg-brand-600 hover:bg-brand-700 text-white text-xs sm:text-sm font-bold rounded-xl transition flex items-center justify-center gap-1.5 shadow-xs">
              <i data-lucide="book-open" class="w-4 h-4"></i>
              <span>Teoría</span>
            </a>
            <a href="${tema.ejerciciosUrl}" class="py-2.5 px-3 bg-emerald-600 hover:bg-emerald-700 text-white text-xs sm:text-sm font-bold rounded-xl transition flex items-center justify-center gap-1.5 shadow-xs">
              <i data-lucide="dumbbell" class="w-4 h-4"></i>
              <span>Ejercicios</span>
            </a>
          </div>
        </div>
      `;
    }

    function irA(ruta) {
      window.location.hash = ruta;
    }

    function volverAtras() {
      const hash = window.location.hash.replace(/^#\/?/, '');
      const partes = hash ? hash.split('/') : [];
      partes.pop();
      irA(partes.join('/'));
    }

    function actualizarVista() {
      const hash = window.location.hash.replace(/^#\/?/, '');
      const partes = hash ? hash.split('/') : [];
      const [bloqueKey, cursoKey, ramaKey] = partes;

      const vista = document.getElementById('vista-actual');
      const barraNav = document.getElementById('barra-navegacion');
      const migas = document.getElementById('migas-pan');

      // Reiniciar animación suave
      vista.classList.remove('fade-in');
      void vista.offsetWidth;
      vista.classList.add('fade-in');

      // ==========================================================
      // PASO 1: PÁGINA PRINCIPAL (MATEMÁTICAS vs FÍSICA Y QUÍMICA)
      // ==========================================================
      if (!bloqueKey || !catalogo[bloqueKey]) {
        barraNav.classList.add('hidden');
        vista.innerHTML = `
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-6 max-w-3xl mx-auto pt-2">
            
            <!-- BLOQUE MATEMÁTICAS -->
            <button onclick="irA('matematicas')" class="group bg-white rounded-3xl border-4 border-rose-200 hover:border-brand-600 p-8 sm:p-10 text-center shadow-lg hover:shadow-2xl transition-all duration-200 transform hover:-translate-y-1 cursor-pointer flex flex-col items-center justify-center gap-4">
              <div class="w-20 h-20 rounded-2xl bg-rose-50 border border-rose-200 flex items-center justify-center text-4xl group-hover:scale-110 transition-transform">
                📐
              </div>
              <span class="font-display font-extrabold text-2xl sm:text-3xl text-slate-900 group-hover:text-brand-600 transition-colors">
                MATEMÁTICAS
              </span>
            </button>

            <!-- BLOQUE FÍSICA Y QUÍMICA -->
            <button onclick="irA('fisica-quimica')" class="group bg-white rounded-3xl border-4 border-blue-200 hover:border-blue-600 p-8 sm:p-10 text-center shadow-lg hover:shadow-2xl transition-all duration-200 transform hover:-translate-y-1 cursor-pointer flex flex-col items-center justify-center gap-4">
              <div class="w-20 h-20 rounded-2xl bg-blue-50 border border-blue-200 flex items-center justify-center text-4xl group-hover:scale-110 transition-transform">
                ⚛️
              </div>
              <span class="font-display font-extrabold text-2xl sm:text-3xl text-slate-900 group-hover:text-blue-600 transition-colors">
                FÍSICA Y QUÍMICA
              </span>
            </button>

          </div>
        `;
        if (window.lucide) lucide.createIcons();
        window.scrollTo({ top: 0, behavior: 'smooth' });
        return;
      }

      const bloque = catalogo[bloqueKey];
      barraNav.classList.remove('hidden');

      // ==========================================================
      // PASO 2: ELEGIR CURSO (1º y 2º ESO, 3º y 4º ESO, 1º BACH, 2º BACH)
      // ==========================================================
      if (!cursoKey || !bloque.cursos[cursoKey]) {
        migas.innerHTML = `
          <a href="#" onclick="irA(''); return false;" class="hover:text-brand-600">Inicio</a>
          <span>&rsaquo;</span>
          <span class="text-slate-900 font-bold">${bloque.nombre}</span>
        `;

        vista.innerHTML = `
          <div class="text-center mb-8">
            <h2 class="font-display font-extrabold text-2xl sm:text-4xl text-slate-900 flex items-center justify-center gap-3">
              <span>${bloque.icono}</span>
              <span>${bloque.nombre}</span>
            </h2>
          </div>

          <div class="grid grid-cols-1 sm:grid-cols-2 gap-5 max-w-3xl mx-auto">
            ${Object.entries(bloque.cursos).map(([key, c]) => `
              <button onclick="irA('${bloqueKey}/${key}')" class="group bg-white rounded-3xl border-2 border-slate-200 hover:border-slate-800 p-7 sm:p-8 text-center shadow-md hover:shadow-xl transition-all transform hover:-translate-y-1 cursor-pointer flex flex-col items-center justify-center gap-3">
                <span class="${c.color} text-white font-display font-extrabold text-sm px-3.5 py-1 rounded-xl">
                  ${c.etiqueta}
                </span>
                <span class="font-display font-extrabold text-2xl text-slate-900 group-hover:text-brand-600 transition-colors">
                  ${c.nombre}
                </span>
              </button>
            `).join('')}
          </div>
        `;
        if (window.lucide) lucide.createIcons();
        window.scrollTo({ top: 0, behavior: 'smooth' });
        return;
      }

      const curso = bloque.cursos[cursoKey];

      // ==========================================================
      // PASO 3A: SI EL CURSO TIENE RAMAS (1º BACH y 2º BACH) Y AÚN NO SE HA ELEGIDO RAMA
      // ==========================================================
      if (curso.ramas && (!ramaKey || !curso.ramas[ramaKey])) {
        migas.innerHTML = `
          <a href="#" onclick="irA(''); return false;" class="hover:text-brand-600">Inicio</a>
          <span>&rsaquo;</span>
          <a href="#" onclick="irA('${bloqueKey}'); return false;" class="hover:text-brand-600">${bloque.nombre}</a>
          <span>&rsaquo;</span>
          <span class="text-slate-900 font-bold">${curso.nombre}</span>
        `;

        vista.innerHTML = `
          <div class="text-center mb-8">
            <span class="${curso.color} text-white font-display font-bold text-xs px-3 py-1 rounded-full uppercase tracking-wider">
              ${bloque.nombre}
            </span>
            <h2 class="font-display font-extrabold text-2xl sm:text-4xl text-slate-900 mt-2">
              ${curso.nombre}
            </h2>
          </div>

          <div class="grid grid-cols-1 sm:grid-cols-2 gap-6 max-w-3xl mx-auto">
            ${Object.entries(curso.ramas).map(([rKey, rObj]) => `
              <button onclick="irA('${bloqueKey}/${cursoKey}/${rKey}')" class="group bg-white rounded-3xl border-4 border-slate-200 hover:border-slate-800 p-8 sm:p-10 text-center shadow-md hover:shadow-xl transition-all transform hover:-translate-y-1 cursor-pointer flex flex-col items-center justify-center gap-3">
                <span class="${rObj.color} text-white font-display font-extrabold text-xs px-3.5 py-1 rounded-xl">
                  ${curso.nombre}
                </span>
                <span class="font-display font-extrabold text-2xl sm:text-3xl text-slate-900 group-hover:text-brand-600 transition-colors">
                  ${rObj.nombre}
                </span>
              </button>
            `).join('')}
          </div>
        `;
        if (window.lucide) lucide.createIcons();
        window.scrollTo({ top: 0, behavior: 'smooth' });
        return;
      }

      // ==========================================================
      // PASO 3B / PASO 4: MOSTRAR LOS TEMAS DEL CURSO O DE LA RAMA ELEGIDA
      // ==========================================================
      let listaTemas = [];
      let tituloPantalla = "";

      if (curso.ramas && ramaKey && curso.ramas[ramaKey]) {
        const rama = curso.ramas[ramaKey];
        listaTemas = rama.temas;
        tituloPantalla = `${curso.nombre} &bull; ${rama.nombre}`;
        migas.innerHTML = `
          <a href="#" onclick="irA(''); return false;" class="hover:text-brand-600">Inicio</a>
          <span>&rsaquo;</span>
          <a href="#" onclick="irA('${bloqueKey}'); return false;" class="hover:text-brand-600">${bloque.nombre}</a>
          <span>&rsaquo;</span>
          <a href="#" onclick="irA('${bloqueKey}/${cursoKey}'); return false;" class="hover:text-brand-600">${curso.nombre}</a>
          <span>&rsaquo;</span>
          <span class="text-slate-900 font-bold">${rama.nombre}</span>
        `;
      } else {
        listaTemas = curso.temas;
        tituloPantalla = `${bloque.nombre} &bull; ${curso.nombre}`;
        migas.innerHTML = `
          <a href="#" onclick="irA(''); return false;" class="hover:text-brand-600">Inicio</a>
          <span>&rsaquo;</span>
          <a href="#" onclick="irA('${bloqueKey}'); return false;" class="hover:text-brand-600">${bloque.nombre}</a>
          <span>&rsaquo;</span>
          <span class="text-slate-900 font-bold">${curso.nombre}</span>
        `;
      }

      vista.innerHTML = `
        <div class="text-center mb-8">
          <h2 class="font-display font-extrabold text-2xl sm:text-3xl text-slate-900">
            ${tituloPantalla}
          </h2>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
          ${listaTemas.map(t => crearTarjetaTema(t)).join('')}
        </div>
      `;

      if (window.lucide) lucide.createIcons();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    window.addEventListener('hashchange', actualizarVista);
    document.addEventListener('DOMContentLoaded', actualizarVista);
  </script>
</body>
</html>
