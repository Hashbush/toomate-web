  <style>
    .fade-in {
      animation: fadeIn 0.2s ease-out;
    }

      from { opacity: 0; transform: translateY(6px); }

    }
    /* Botones con rojo y verde más suaves y agradables */
    .btn-teoria-suave {
      background-color: #e57373;
      color: #ffffff;
    }
    .btn-teoria-suave:hover {
      background-color: #ef5350;
    }
    .btn-ejercicios-suave {
      background-color: #66bb6a;
      color: #ffffff;
    }
    .btn-ejercicios-suave:hover {

<body class="bg-slate-100 text-slate-800 antialiased min-h-screen flex flex-col justify-between selection:bg-rose-400 selection:text-white">

  <div>
    <!-- CABECERA CON EL PROFE TOMATE GRANDE -->
    <header class="bg-white border-b border-slate-200 pt-7 pb-6 px-4 text-center shadow-xs">
      <div class="max-w-5xl mx-auto flex flex-col items-center">

          <div class="w-36 h-36 sm:w-48 sm:h-48 rounded-3xl bg-white border-4 border-rose-200 shadow-xl overflow-hidden flex items-center justify-center mb-3 group-hover:scale-105 transition-transform duration-200">
            <img src="logo-tomate.jpg" alt="Profesor Tomate - Toomate.es" class="w-full h-full object-cover scale-125">
          </div>

          <i data-lucide="arrow-left" class="w-5 h-5"></i>
          <span>Volver atrás</span>
        </button>

        <div id="migas-pan" class="flex flex-wrap items-center gap-1.5 text-xs sm:text-sm font-semibold text-slate-500">
        </div>
      </div>

  </div>

    function crearTarjetaTema(tema) {
      return `
        <div class="bg-white rounded-3xl border-2 border-slate-200 hover:border-slate-300 p-5 flex flex-col justify-between transition shadow-sm hover:shadow-lg">
          <div>
            <!-- TÍTULO DEL TEMA MÁS GRANDE -->
            <h4 class="font-display font-extrabold text-xl sm:text-2xl text-slate-900 text-center leading-tight mb-4">
              ${tema.titulo}
            </h4>

            <!-- IMAGEN ESTILO MINIATURA DE YOUTUBE -->
            <div class="rounded-2xl overflow-hidden border-2 border-slate-200 mb-5 aspect-video shadow-md">
              ${obtenerMiniaturaSVG(tema.miniatura)}
            </div>
          </div>

          <!-- BOTONES CON ROJO Y VERDE MÁS SUAVES -->
          <div class="grid grid-cols-2 gap-3">
            <a href="${tema.teoriaUrl}" class="btn-teoria-suave py-3 px-3 text-sm sm:text-base font-bold rounded-xl transition flex items-center justify-center gap-2 shadow-xs">
              <i data-lucide="book-open" class="w-4 h-4"></i>
              <span>Teoría</span>
            </a>
            <a href="${tema.ejerciciosUrl}" class="btn-ejercicios-suave py-3 px-3 text-sm sm:text-base font-bold rounded-xl transition flex items-center justify-center gap-2 shadow-xs">
              <i data-lucide="dumbbell" class="w-4 h-4"></i>
              <span>Ejercicios</span>
            </a>
          </div>
        </div>
      `;
    }

    function irA(ruta) {
      window.location.hash = ruta;
    }

    function volverAtras() {
      const hash = window.location.hash.replace(/^#\/?/, '');
      const partes = hash ? hash.split('/') : [];
      partes.pop();
      irA(partes.join('/'));
    }

    function actualizarVista() {
      const hash = window.location.hash.replace(/^#\/?/, '');
      const partes = hash ? hash.split('/') : [];
      const [bloqueKey, cursoKey, ramaKey] = partes;

      const vista = document.getElementById('vista-actual');
      const barraNav = document.getElementById('barra-navegacion');
      const migas = document.getElementById('migas-pan');

      vista.classList.remove('fade-in');
      void vista.offsetWidth;
      vista.classList.add('fade-in');

      // ==========================================================
      // PASO 1: PÁGINA PRINCIPAL (MATEMÁTICAS vs FÍSICA Y QUÍMICA)
      // ==========================================================
      if (!bloqueKey || !catalogo[bloqueKey]) {
        barraNav.classList.add('hidden');
        vista.innerHTML = `
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-6 max-w-3xl mx-auto pt-2">
            
            <!-- BLOQUE MATEMÁTICAS -->
            <button onclick="irA('matematicas')" class="group bg-white rounded-3xl border-4 border-rose-200 hover:border-rose-400 p-8 sm:p-10 text-center shadow-lg hover:shadow-2xl transition-all duration-200 transform hover:-translate-y-1 cursor-pointer flex flex-col items-center justify-center gap-4">
              <div class="w-20 h-20 rounded-2xl bg-rose-50 border border-rose-200 flex items-center justify-center text-4xl group-hover:scale-110 transition-transform">
                📐
              </div>
              <span class="font-display font-extrabold text-2xl sm:text-3xl text-slate-900 group-hover:text-rose-500 transition-colors">
                MATEMÁTICAS
              </span>
            </button>

            <!-- BLOQUE FÍSICA Y QUÍMICA -->
            <button onclick="irA('fisica-quimica')" class="group bg-white rounded-3xl border-4 border-blue-200 hover:border-blue-500 p-8 sm:p-10 text-center shadow-lg hover:shadow-2xl transition-all duration-200 transform hover:-translate-y-1 cursor-pointer flex flex-col items-center justify-center gap-4">
              <div class="w-20 h-20 rounded-2xl bg-blue-50 border border-blue-200 flex items-center justify-center text-4xl group-hover:scale-110 transition-transform">
                ⚛️
              </div>
              <span class="font-display font-extrabold text-2xl sm:text-3xl text-slate-900 group-hover:text-blue-600 transition-colors">
                FÍSICA Y QUÍMICA
              </span>
            </button>

          </div>
        `;
        if (window.lucide) lucide.createIcons();
        window.scrollTo({ top: 0, behavior: 'smooth' });
        return;
      }

      const bloque = catalogo[bloqueKey];
      barraNav.classList.remove('hidden');

      // ==========================================================
      // PASO 2: ELEGIR CURSO (1º ESO, 2º ESO, 3º ESO, 4º ESO, 1º BACH, 2º BACH)
      // Sin repetir el nombre del curso dos veces dentro del botón
      // ==========================================================
      if (!cursoKey || !bloque.cursos[cursoKey]) {
        migas.innerHTML = `
          <a href="#" onclick="irA(''); return false;" class="hover:text-rose-500">Inicio</a>
          <span>&rsaquo;</span>
          <span class="text-slate-900 font-bold">${bloque.nombre}</span>
        `;

        vista.innerHTML = `
          <div class="text-center mb-8">
            <h2 class="font-display font-extrabold text-2xl sm:text-4xl text-slate-900 flex items-center justify-center gap-3">
              <span>${bloque.icono}</span>
              <span>${bloque.nombre}</span>
            </h2>
          </div>

          <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-5 max-w-4xl mx-auto">
            ${Object.entries(bloque.cursos).map(([key, c]) => `
              <button onclick="irA('${bloqueKey}/${key}')" class="group bg-white rounded-3xl border-2 border-slate-200 hover:border-slate-800 p-8 text-center shadow-md hover:shadow-xl transition-all transform hover:-translate-y-1 cursor-pointer flex flex-col items-center justify-center gap-3">
                <div class="w-12 h-2 rounded-full ${c.color}"></div>
                <span class="font-display font-extrabold text-2xl sm:text-3xl text-slate-900 group-hover:text-rose-500 transition-colors">
                  ${c.nombre}
                </span>
              </button>
            `).join('')}
          </div>
        `;
        if (window.lucide) lucide.createIcons();
        window.scrollTo({ top: 0, behavior: 'smooth' });
        return;
      }

      const curso = bloque.cursos[cursoKey];

      // ==========================================================
      // PASO 3A: ELEGIR RAMA EN BACHILLERATO (Sin texto repetido)
      // ==========================================================
      if (curso.ramas && (!ramaKey || !curso.ramas[ramaKey])) {
        migas.innerHTML = `
          <a href="#" onclick="irA(''); return false;" class="hover:text-rose-500">Inicio</a>
          <span>&rsaquo;</span>
          <a href="#" onclick="irA('${bloqueKey}'); return false;" class="hover:text-rose-500">${bloque.nombre}</a>
          <span>&rsaquo;</span>
          <span class="text-slate-900 font-bold">${curso.nombre}</span>
        `;

        vista.innerHTML = `
          <div class="text-center mb-8">
            <h2 class="font-display font-extrabold text-2xl sm:text-4xl text-slate-900">
              ${curso.nombre}
            </h2>
          </div>

          <div class="grid grid-cols-1 sm:grid-cols-2 gap-6 max-w-3xl mx-auto">
            ${Object.entries(curso.ramas).map(([rKey, rObj]) => `
              <button onclick="irA('${bloqueKey}/${cursoKey}/${rKey}')" class="group bg-white rounded-3xl border-4 border-slate-200 hover:border-slate-800 p-9 sm:p-11 text-center shadow-md hover:shadow-xl transition-all transform hover:-translate-y-1 cursor-pointer flex flex-col items-center justify-center">
                <span class="font-display font-extrabold text-2xl sm:text-3xl text-slate-900 group-hover:text-rose-500 transition-colors">
                  ${rObj.nombre}
                </span>
              </button>
            `).join('')}
          </div>
        `;
        if (window.lucide) lucide.createIcons();
        window.scrollTo({ top: 0, behavior: 'smooth' });
        return;
      }

      // ==========================================================
      // PASO 3B / PASO 4: MOSTRAR LOS TEMAS CON MINIATURAS YOUTUBE
      // ==========================================================
      let listaTemas = [];
      let tituloPantalla = "";

      if (curso.ramas && ramaKey && curso.ramas[ramaKey]) {
        const rama = curso.ramas[ramaKey];
        listaTemas = rama.temas;
        tituloPantalla = `${curso.nombre} &bull; ${rama.nombre}`;
        migas.innerHTML = `
          <a href="#" onclick="irA(''); return false;" class="hover:text-rose-500">Inicio</a>
          <span>&rsaquo;</span>
          <a href="#" onclick="irA('${bloqueKey}'); return false;" class="hover:text-rose-500">${bloque.nombre}</a>
          <span>&rsaquo;</span>
          <a href="#" onclick="irA('${bloqueKey}/${cursoKey}'); return false;" class="hover:text-rose-500">${curso.nombre}</a>
          <span>&rsaquo;</span>
          <span class="text-slate-900 font-bold">${rama.nombre}</span>
        `;
      } else {
        listaTemas = curso.temas;
        tituloPantalla = `${bloque.nombre} &bull; ${curso.nombre}`;
        migas.innerHTML = `
          <a href="#" onclick="irA(''); return false;" class="hover:text-rose-500">Inicio</a>
          <span>&rsaquo;</span>
          <a href="#" onclick="irA('${bloqueKey}'); return false;" class="hover:text-rose-500">${bloque.nombre}</a>
          <span>&rsaquo;</span>
          <span class="text-slate-900 font-bold">${curso.nombre}</span>
        `;
      }

      vista.innerHTML = `
        <div class="text-center mb-8">
          <h2 class="font-display font-extrabold text-2xl sm:text-4xl text-slate-900">
            ${tituloPantalla}
          </h2>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
          ${listaTemas.map(t => crearTarjetaTema(t)).join('')}
        </div>
      `;

      if (window.lucide) lucide.createIcons();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    window.addEventListener('hashchange', actualizarVista);
    document.addEventListener('DOMContentLoaded', actualizarVista);
  </script>
