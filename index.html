                muestraLatex: "\\vec{F} = -G\\frac{M \\cdot m}{r^2}\\vec{u}_r",
                teoriaUrl: "materiales/campo-gravitatorio-2-bach.html",
                ejerciciosUrl: "materiales/ejercicios-campo-gravitatorio-2-bach.html"

              {
                titulo: "Campo Eléctrico: Ley de Coulomb y Potencial",
                muestraLatex: "\\vec{F} = K\\frac{q_1 \\cdot q_2}{r^2}\\vec{u}_r",
                teoriaUrl: "materiales/campo-electrico-2-bach.html",
                ejerciciosUrl: "materiales/ejercicios-campo-electrico-2-bach.html"

              {

                muestraLatex: "\\vec{F} = q(\\vec{v} \\times \\vec{B}) \\quad \\cdot \\quad \\varepsilon = -\\frac{d\\Phi}{dt}",

              {

            ]
          },
          {
            nombre: "QUÍMICA",
            badgeColor: "bg-emerald-100 text-emerald-800 border-emerald-300",
            temas: [
              {
                titulo: "Equilibrio Químico: Kc, Kp y Le Châtelier",
                muestraLatex: "K_p = K_c \\cdot (R \\cdot T)^{\\Delta n}",

    function renderizarFormula(latex) {
      if (typeof katex !== 'undefined') {
        try {
          return katex.renderToString(latex, { displayMode: true, throwOnError: false });
        } catch (e) {
          return latex;
        }
      }
      return latex;
    }

    function crearTarjetaTema(tema) {
      return `
        <div class="bg-white rounded-2xl border-2 border-slate-200 hover:border-slate-400 p-5 flex flex-col justify-between transition shadow-xs hover:shadow-md">
          <div>
            <!-- TÍTULO DEL TEMA -->
            <h4 class="font-display font-bold text-base sm:text-lg text-slate-900 text-center mb-3">
              ${tema.titulo}
            </h4>

            <!-- MUESTRA VISUAL DE ECUACIÓN (ESTILO IMAGEN DE CUADERNO) -->
            <div class="math-preview-box rounded-xl border border-slate-200 p-4 mb-4 min-h-[100px] flex items-center justify-center text-slate-800 shadow-inner overflow-x-auto">
              ${renderizarFormula(tema.muestraLatex)}
            </div>
          </div>

          <!-- SOLO LOS 2 BOTONES: TEORÍA Y EJERCICIOS -->
          <div class="grid grid-cols-2 gap-2.5">
            <a href="${tema.teoriaUrl}" target="_blank" class="py-2.5 px-3 bg-brand-600 hover:bg-brand-700 text-white text-xs sm:text-sm font-bold rounded-xl transition flex items-center justify-center gap-1.5 shadow-xs">
              <i data-lucide="book-open" class="w-4 h-4"></i>
              <span>Teoría</span>
            </a>
            <a href="${tema.ejerciciosUrl}" target="_blank" class="py-2.5 px-3 bg-emerald-600 hover:bg-emerald-700 text-white text-xs sm:text-sm font-bold rounded-xl transition flex items-center justify-center gap-1.5 shadow-xs">
              <i data-lucide="dumbbell" class="w-4 h-4"></i>
              <span>Ejercicios</span>
            </a>
          </div>
        </div>
      `;
    }

    function renderizarBloque(estructura, contenedorId) {
      const contenedor = document.getElementById(contenedorId);
      if (!contenedor) return;

      contenedor.innerHTML = estructura.map(curso => `
        <div id="${curso.id}" class="scroll-mt-6">
          <!-- CABECERA DEL CURSO -->
          <div class="flex items-center gap-3 mb-5 pb-2 border-b-2 border-slate-200">
            <span class="${curso.colorCurso} text-white font-display font-extrabold text-sm sm:text-base px-4 py-1.5 rounded-xl shadow-xs">
              ${curso.cursoTitulo}
            </span>
          </div>

          <!-- SUBGRUPOS (Ej. CCSS / MATEMÁTICAS I o FÍSICA / QUÍMICA) -->
          <div class="space-y-8">
            ${curso.subgrupos.map(sub => `
              <div>
                ${sub.nombre ? `
                  <div class="mb-4">
                    <span class="inline-block font-display font-extrabold text-sm sm:text-base px-4 py-1.5 rounded-xl border-2 ${sub.badgeColor}">
                      ${sub.nombre}
                    </span>
                  </div>
                ` : ''}
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
                  ${sub.temas.map(t => crearTarjetaTema(t)).join('')}
                </div>
              </div>
            `).join('')}
          </div>
        </div>
      `).join('');
    }

    document.addEventListener('DOMContentLoaded', () => {
      renderizarBloque(estructuraMatematicas, 'contenedor-matematicas');
      renderizarBloque(estructuraFisicaQuimica, 'contenedor-fisica-quimica');
      if (window.lucide) {
        lucide.createIcons();
      }
    });
  </script>
</body>
